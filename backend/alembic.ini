# Alembic configuration for the Local AI Model Lab SQLite database.
#
# Migrations run automatically on application startup, but you can also drive
# them manually:
#
#     cd backend
#     alembic upgrade head
#     alembic downgrade -1
#
# The database URL is read from the DATABASE_URL environment variable, then the
# value below, so the same file is shared by the portal and its migrations.

[alembic]
# Path to migration scripts.
script_location = alembic

# Use the DATABASE_URL env var when present, otherwise fall back to the file URL.
prepend_sys_path = .

# The default SQLite URL used when DATABASE_URL is unset.
[main]
sqlalchemy.url = sqlite:///./data/model-lab.db

[loggers]
keys = root, sqlengine, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlengine]
level = WARNING
handlers = 
qualname = sqlengine

[logger_alembic]
level = INFO
handlers = 
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
